name: Deploy GeoScope to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create runtime Google Maps configuration
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GM }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const key = process.env.GOOGLE_MAPS_API_KEY || '';
          fs.writeFileSync(
            'config.js',
            `window.GEOSCOPE_CONFIG = ${JSON.stringify({ googleMapsApiKey: key })};\n`
          );
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
