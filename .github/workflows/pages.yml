name: Deploy GeoScope to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate product and game runtimes
        run: |
          node --check geoscope.js
          node --check arena-pro.js
          node --check arena-query-config.js
          node --check arena-shell-bridge.js
          node --check arena-i18n.js
          node --check arena-v3.js
          node <<'NODE'
          const fs = require('fs');
          const chunks = [
            'arena-v3-1.txt','arena-v3-2.txt','arena-v3-3.txt','arena-v3-4a.txt','arena-v3-4b.txt',
            'arena-v3-5a.txt','arena-v3-5b.txt','arena-v3-6a.txt','arena-v3-6b.txt'
          ];
          const encoded = chunks.map(file => fs.readFileSync(file, 'utf8').trim()).join('');
          fs.writeFileSync('/tmp/geoscope-arena-runtime.js', Buffer.from(encoded, 'base64').toString('utf8'));

          const landing = fs.readFileSync('geoscope.html', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const arena = fs.readFileSync('arena-pro.html', 'utf8');
          const screenFix = fs.readFileSync('arena-pro-screen-fix.css', 'utf8').replace(/\s+/g, '');
          const requiredLandingIds = ['landing','auth','app','view-hub','view-play','view-profile','launchGame'];
          for (const id of requiredLandingIds) {
            if (!landing.includes(`id="${id}"`)) throw new Error(`geoscope.html missing #${id}`);
          }
          if (!landing.includes('geoscope.css') || !landing.includes('geoscope.js')) {
            throw new Error('GeoScope product shell assets are missing');
          }
          if (!index.includes('geoscope.html')) throw new Error('index.html does not open the product shell');
          if (!arena.includes('arena-query-config.js') || !arena.includes('arena-shell-bridge.js')) {
            throw new Error('Arena is not connected to the product hub');
          }
          if (!arena.includes('arena-pro-screen-fix.css')) {
            throw new Error('arena-pro.html is missing the screen visibility fix stylesheet');
          }
          if (!screenFix.includes('.screen.final{display:none}') || !screenFix.includes('.screen.final.active{display:grid')) {
            throw new Error('Final screen visibility regression detected');
          }
          NODE
          node --check /tmp/geoscope-arena-runtime.js

      - name: Create runtime service configuration
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GM }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const mapsKey = process.env.GOOGLE_MAPS_API_KEY || '';
          const googleClientId = process.env.GOOGLE_OAUTH_CLIENT_ID || '';
          fs.writeFileSync('config.js', `window.GEOSCOPE_CONFIG = ${JSON.stringify({ googleMapsApiKey: mapsKey })};\n`);
          fs.writeFileSync('auth-config.js', `window.GEOSCOPE_AUTH_CONFIG = ${JSON.stringify({ googleClientId })};\n`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
