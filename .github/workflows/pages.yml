name: Deploy GeoScope to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate product, arena and 15 locales
        run: |
          node --check geoscope.js
          node --check geoscope-v2.js
          node --check arena-pro.js
          node --check arena-v5.js
          node --check arena-query-config.js
          node --check geoscope-locales-core.js
          node --check geoscope-locales-loader.js
          node --check geoscope-locales-final.js
          for file in geoscope-template-{1..5}.js arena-template-{1..2}.js locale-{en,es,pt,fr,de,ru,zh,ja,ko,ar,hi,id,tr,it,pl}.js; do
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          global.window = {};
          require('./geoscope-locales-core.js');
          const localeCodes = ['en','es','pt','fr','de','ru','zh','ja','ko','ar','hi','id','tr','it','pl'];
          for (const code of localeCodes) require(`./locale-${code}.js`);
          require('./geoscope-locales-final.js');
          const i18n = window.GeoScopeI18n;
          i18n.validate();
          if (Object.keys(i18n.locales).length !== 15) throw new Error('Expected exactly 15 locales');
          const referenceKeys = Object.keys(i18n.locales.en);
          if (referenceKeys.length < 200) throw new Error(`Translation pack is incomplete: ${referenceKeys.length} keys`);
          for (const code of localeCodes) {
            const keys = Object.keys(i18n.locales[code]);
            if (keys.length !== referenceKeys.length) throw new Error(`Locale ${code} is incomplete`);
          }

          global.window = {};
          for (let i = 1; i <= 5; i++) require(`./geoscope-template-${i}.js`);
          const shell = window.__GS_TEMPLATE.join('');
          global.window = {};
          for (let i = 1; i <= 2; i++) require(`./arena-template-${i}.js`);
          const arena = window.__GS_ARENA_TEMPLATE.join('');
          const usedKeys = [...shell.matchAll(/data-i18n(?:-placeholder)?="([^"]+)"/g), ...arena.matchAll(/data-i18n(?:-placeholder)?="([^"]+)"/g)].map(match => match[1]);
          for (const key of usedKeys) if (!referenceKeys.includes(key)) throw new Error(`Missing translation key: ${key}`);

          const productEntry = fs.readFileSync('geoscope.html','utf8');
          const arenaEntry = fs.readFileSync('arena-pro.html','utf8');
          const index = fs.readFileSync('index.html','utf8');
          if (!productEntry.includes('geoscope.js?v=20260728-2')) throw new Error('Product entry is not cache-busted');
          if (!arenaEntry.includes('arena-pro.js?v=20260728-2')) throw new Error('Arena entry is not cache-busted');
          if (!index.includes('geoscope.html')) throw new Error('Main URL does not open GeoScope');
          for (const file of ['geoscope-v2-a.css','geoscope-v2-b.css','geoscope-v2-c.css','geoscope-v2-d.css','geoscope-v2-e.css','arena-v5.css']) {
            if (!fs.existsSync(file) || fs.statSync(file).size < 100) throw new Error(`Missing visual asset: ${file}`);
          }
          console.log(`Validated ${localeCodes.length} locales, ${referenceKeys.length} strings and ${usedKeys.length} translated UI bindings.`);
          NODE

      - name: Create runtime service configuration
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GM }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const mapsKey = process.env.GOOGLE_MAPS_API_KEY || '';
          const googleClientId = process.env.GOOGLE_OAUTH_CLIENT_ID || '';
          fs.writeFileSync('config.js', `window.GEOSCOPE_CONFIG = ${JSON.stringify({ googleMapsApiKey: mapsKey })};\n`);
          fs.writeFileSync('auth-config.js', `window.GEOSCOPE_AUTH_CONFIG = ${JSON.stringify({ googleClientId })};\n`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
